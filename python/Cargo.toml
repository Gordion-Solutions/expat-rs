[package]
name = "expat-rs-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Python bindings: a drop-in for xml.parsers.expat on expat-rs"
license = "MIT"
repository = "https://github.com/Gordion-Solutions/expat-rs"
# Published to PyPI as `expat-rs` by maturin, not to crates.io.
publish = false

[lib]
name = "_pyexpat"
crate-type = ["cdylib"]

[dependencies]
# One wheel per platform for every CPython from 3.10 (the stable ABI).
pyo3 = { version = "0.30", features = ["abi3-py310"] }
expat-capi = { path = "../expat-capi" }

[features]
# maturin turns this on for wheels; plain `cargo test` links libpython.
extension-module = ["pyo3/extension-module"]

# Its own workspace: built by maturin, with its own lockfile.
[workspace]
