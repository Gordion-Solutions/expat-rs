[package]
name = "expat-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
description = "Memory-safe XML 1.0 parser: streaming, namespaces, hardened against hostile input; aims for libexpat-level conformance"
license = "MIT"
repository = "https://github.com/Gordion-Solutions/expat-rs"
documentation = "https://docs.rs/expat-rs"
readme = "README.md"
keywords = ["xml", "parser", "expat", "memory-safety"]
categories = ["parser-implementations"]
exclude = [".github/", "bench/"]

[dependencies]
thiserror = "1.0"

[[bin]]
name = "xmlwf"
path = "src/bin/xmlwf.rs"

[dev-dependencies]
# minimal — conformance runner is a shell script, not a Rust dep
