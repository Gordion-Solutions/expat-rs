[package]
name = "expat-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
expat-rs = { path = ".." }

# Keep the fuzz crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_vs_whole"
path = "fuzz_targets/stream_vs_whole.rs"
test = false
doc = false
bench = false
