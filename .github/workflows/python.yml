name: Python

# Wheels of the Python package (python/) for every platform, tested on
# every supported CPython, and published to PyPI from a `python-v*` tag.
#
# One wheel per platform serves every CPython from 3.10 (the stable ABI).
# Each is tested with the package's own tests and with CPython's XML test
# suites run through expat_rs.install(), using the test files of the exact
# interpreter version.

on:
  push:
    branches: [main]
    tags: ["python-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-arm64, runner: macos-15, target: aarch64 }
          - { name: windows-x64, runner: windows-2025, target: x64 }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Linux wheels are built in maturin-action's containers.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'Linux'
        with:
          python-version: "3.14"

      - name: Build the wheel
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Built from source as pip would for a platform without a wheel.
      - name: Install from the sdist and test
        run: |
          python -m pip install python/dist/*.tar.gz
          python -m unittest discover -s python/tests -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  test:
    name: test ${{ matrix.wheel }} / Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Every version on one runner per OS; the oldest and newest on the
        # others.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        wheel: [linux-x86_64, macos-arm64, windows-x64]
        include:
          - { wheel: linux-x86_64, runner: ubuntu-24.04 }
          - { wheel: macos-arm64, runner: macos-15 }
          - { wheel: windows-x64, runner: windows-2025 }
          - { wheel: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.10" }
          - { wheel: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.15" }
          - { wheel: macos-x86_64, runner: macos-15-intel, python: "3.10" }
          - { wheel: macos-x86_64, runner: macos-15-intel, python: "3.15" }
          # No CPython 3.10 builds for Windows on Arm.
          - { wheel: windows-arm64, runner: windows-11-arm, python: "3.11" }
          - { wheel: windows-arm64, runner: windows-11-arm, python: "3.15" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist

      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist expat-rs

      - name: Package tests
        run: python -m unittest discover -s python/tests -v

      - name: Fetch CPython's tests for this interpreter
        run: |
          version=$(python -c 'import platform; print(platform.python_version())')
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "v$version" --filter=blob:none --sparse \
            https://github.com/python/cpython.git "$RUNNER_TEMP/cpython"
          git -C "$RUNNER_TEMP/cpython" sparse-checkout set --no-cone /Lib/test/

      - name: CPython's XML tests with expat_rs.install()
        run: PYTHONPATH="$RUNNER_TEMP/cpython/Lib" python python/tests/stdlib.py

  test-musl:
    name: test ${{ matrix.wheel }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wheel: musllinux-x86_64, runner: ubuntu-24.04 }
          - { wheel: musllinux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist

      # Alpine's Python has no test package: the package's tests only.
      - name: Package tests on Alpine
        run: |
          for v in 3.10 3.15; do
            docker run --rm -v "$PWD:/w" -w /w "python:$v-alpine" sh -c \
              "pip install -q --root-user-action=ignore --no-index --find-links dist expat-rs &&
               python -m unittest discover -s python/tests -v"
          done

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [wheels, sdist, test, test-musl]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/expat-rs/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/Cargo.toml | head -1)
          test "refs/tags/python-v$version" = "$GITHUB_REF" ||
            { echo "tag $GITHUB_REF_NAME does not match version $version in python/Cargo.toml"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          packages-dir: dist
