name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --workspace --verbose

      # Includes expat-capi's Layer 1 test, which compiles C probes against
      # expat.h and the static library and compares with libexpat's output.
      - name: cargo test
        run: cargo test --release --workspace --verbose
